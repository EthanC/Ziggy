[ziggy]
database = "./ziggy.db"
config_reload_interval = "30s"

[crawl]
interval = "24h"
concurrency = 8
per_host_concurrency = 2
request_delay = 1.0
request_timeout = 30.0
max_response_bytes = 10485760
max_redirects = 10
max_attempts = 5
max_query_variants_per_base = 20

[archive]
interval = "365d"
concurrency = 1
max_pending_jobs = 2
request_delay = 1.0
dedupe_window = "24h"
max_attempts = 5
pending_timeout = "24h"

[reporting]
interval = "24h"
finalization_grace = "5m"

[logging]
level = "INFO"
discord_min_level = "WARNING"

[[domains]]
host = "example.com"
scheme = "https"
include_subdomains = false
seeds = ["/"]
